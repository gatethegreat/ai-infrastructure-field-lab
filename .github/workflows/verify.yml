name: Verify public lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Scan full Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check
          mkdir /tmp/gitleaks
          tar -xzf "/tmp/${archive}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all --full-history" \
            --redact=100 \
            --no-banner

      - name: Run baseline tests
        run: python -m unittest discover -s experiments/00-baseline -p 'test_*.py' -v

      - name: Run AgentCore policy-lab tests
        run: python -m unittest discover -s experiments/06-strands-agentcore/tests -p 'test_*.py' -v

      - name: Run public-release safety tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
